# Hyprland Configuration
# https://wiki.hypr.land/Configuring/


env = HYPRCURSOR_SIZE,32
env = XCURSOR_SIZE,32
# GDK
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULES,wayland;fcitx;ibus

# do not set
# env = GTK_IM_MODULE,wayland
# env = QT_IM_MODULE,fcitx

env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = QT_QPA_PLATFORM,wayland;xcb

env = TERMINAL,kitty
env = EDITOR,code
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# env = JAVA_TOOL_OPTIONS,-Dawt.toolkit.name=WLToolkit
# env = sun.java2d.vulkan,true
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland

# nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GDK_BACKEND,wayland,x11,*

# firefox vaapi
env = NVD_BACKEND,direct
env = MOZ_DISABLE_RDD_SANDBOX,1
env = CUDA_DISABLE_PERF_BOOST,1
# ==================
# STARTUP APPS
# ==================
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = dbus-update-activation-environment --systemd DISPLAY
# env = DISPLAY,:12
# exec-once = xwayland-satellite :12
exec-once = xrdb ~/.Xresources
exec-once = fcitx5 -d --replace
exec-once = hyprctl setcursor capitaine-cursors-light 32
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpm reload
exec-once = __NV_DISABLE_EXPLICIT_SYNC=1 pot
exec-once = dms run
# exec-once = ~/.config/hypr/dbus.sh
# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us
    numlock_by_default = true
    float_switch_override_focus = 0
    follow_mouse = 2
    sensitivity = 0
    accel_profile = flat
    repeat_rate = 50
    repeat_delay = 200
    mouse_refocus = false
    special_fallthrough = true
    touchpad {
        natural_scroll = false
    }
}

plugin {
    hyprbars {
        bar_height = 30
        
        bar_precedence_over_border = true
        bar_part_of_window = true
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(ff4040), 16, 󰖭, hyprctl dispatch killactive
        # hyprbars-button = rgb(eeee11), 16, , hyprctl dispatch fullscreen 1

        # hyprbars-button = rgb(eeee11), 10, , hyprctl dispatch fullscreen 1

        # cmd to run on double click of the bar
        # on_double_click = hyprctl dispatch fullscreen 0
    }
}

animations {
    enabled = yes

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = overshot,   0.05,  0.9,  0.1,  1.1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 3, overshot, slidevert
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
    focus_on_activate = 1
}

xwayland {
  enabled = true
  force_zero_scaling = true
  create_abstract_socket = true
}

binds {
    hide_special_on_workspace_change = true
    workspace_back_and_forth = false
}

source = ./custom/colors.conf
source = ./custom/outputs.conf
source = ./custom/layout.conf
source = ./custom/cursor.conf
source = ./custom/binds.conf
source = ./custom/rules.conf
