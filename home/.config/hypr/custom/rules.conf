## Workspace Rules
workspace=1,persistent:true,monitor:DP-1,defaultName:browser,default:true
workspace=2,persistent:true,monitor:DP-1,defaultName:code
workspace=3,persistent:true,monitor:DP-1,defaultName:idea
workspace=4,persistent:true,monitor:DP-1,defaultName:android
workspace=5,persistent:true,monitor:DP-1,defaultName:kitty
workspace=6,persistent:true,monitor:DP-1,defaultName:media
workspace=7,persistent:true,monitor:DP-1,defaultName:note
workspace=8,persistent:true,monitor:HDMI-A-1,defaultName:ai,default:true
workspace=9,persistent:true,monitor:HDMI-A-1,defaultName:devtools

# windowrule {
#     name = screen-no-border
#     match:fullscreen = 1
#     border_size = 0
#     rounding = 0
# }

workspace = f[1], gapsout:0, gapsin:0
workspace = w[tv1], gapsout:0, gapsin:0


# windowrule {
#     name = auto-fullscreen
#     match:initial_class = ^(jetbrains-idea|jetbrains-studio|code|zen)$ 
#     match:workspace = f[0]w[tv0]
#     fullscreen_state = 1
# }

windowrule = border_size 0, match:workspace w[tv1]
windowrule = rounding 0, match:workspace w[tv1]


windowrule = workspace name:code, match:initial_class ^(code)$ #, ,fullscreen_state 1 1
windowrule = workspace name:idea, match:initial_class ^(jetbrains-idea)$ #, ,fullscreen_state 1 1
windowrule = workspace name:android, match:initial_class ^(jetbrains-studio)$ #, ,fullscreen_state 1 1
windowrule = workspace name:kitty, match:initial_class ^(kitty)$, fullscreen_state -1 #, ,fullscreen_state 1 1
windowrule = workspace name:media, match:class (Feishu) #, ,fullscreen_state 1 1
windowrule = workspace name:media, match:class QQ, match:title QQ #, ,fullscreen_state 1 1
windowrule = workspace name:note, match:initial_class ^(obsidian)$ #, ,fullscreen_state 1 1
windowrule = workspace name:browser, match:initial_class zen, match:initial_title Zen Browser #, ,fullscreen_state 1 1
windowrule = workspace name:browser, match:initial_class ^(google-chrome)$ #, ,fullscreen_state 1 1

# workspace {
#     name = no-gaps-when-fullscreen
#     match:workspace = w[tv1]
#     gapsin = 0
#     gapsout = 0
# }


windowrule {
    name = float-size-noblur
    match:initial_class = ^(jetbrains-idea|jetbrains-studio)$
    match:float = true
    center = true
    no_blur = true
    size = monitor_w*0.4 monitor_h*0.5
}


# zen devtools
windowrule {
    name = float-devtools
    match:class = zen
    # empty title
    match:initial_title = ^$
    workspace = name:devtools
}


windowrule {
    name = float-special
    workspace = special
    match:initial_class = ^(SPlayer|Pot|pot|cloudmusic.exe)$
    # match:initial_class = ^(SPlayer|Pot|pot|explorer.exe)$
    float = true
    # no_blur = true
    center = true
    size = monitor_w*0.5 monitor_h*0.6
}

windowrule {
    name = float-system-tray
    match:initial_class = ^(explorer.exe)$
    float = true
}

windowrule {
    name = float-qq
    match:initial_class = ^(QQ)$
	match:initial_title = ^(图片查看器)$
    float = true
    center = true
    size = monitor_w*0.5 monitor_h*0.6
}

windowrule = float on, match:title ^(Open File)(.*)$
windowrule = float on, match:title ^(Select a File)(.*)$
windowrule = float on, match:title ^(Choose wallpaper)(.*)$
windowrule = float on, match:title ^(Open Folder)(.*)$
windowrule = float on, match:title ^(Save As)(.*)$
windowrule = float on, match:title ^(Library)(.*)$
windowrule = float on, match:class Feishu, match:title 图片
windowrule = float on, match:class ^(xdg-desktop-portal)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$


######## Window rules ########
windowrule = float on, size (monitor_w*0.5) (monitor_h*0.5), match:class ^(xarchiver|org.kde.polkit-kde-authentication-agent-1)$
windowrule = stay_focused on, match:title ^(Save Image|New Layer|Rotate View)$

 
# Dialogs
# layerrule = blur on, match:namespace class:waybar$
# layerrule = blur on, match:namespace class:notifications$
# layerrule = blur on, match:namespace class:wofi

# 全局非焦点透明
windowrule {
    name = global-inactive-opacity
    match:focus = 0
    opacity = 0.8 override
}

# 排除 Chrome 规则
windowrule {
    name = exclude-chrome-opacity
    match:class = ^(google-chrome|zen|org.kde.haruna)$
    match:focus = 0
    opacity = 1.0 override
}


# DMS windows floating by default
# ! Hyprland doesn't size these windows correctly so disabling by default here
windowrule = float on, match:class ^(org.quickshell)$
layerrule = no_anim on, match:namespace ^(quickshell)$
