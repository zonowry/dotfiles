# === Application Launchers ===
bind = SUPER, RETURN, exec, kitty
bind = CTRL, space, exec, dms ipc call spotlight toggle
bind = SUPER SHIFT, V, exec, dms ipc call clipboard toggle
bind = SUPER, comma, exec, dms ipc call settings focusOrToggle
bind = ALT, Q, exec, curl "127.0.0.1:60828/selection_translate"

# === Cheat sheet
bind = SUPER SHIFT, Slash, exec, dms ipc call keybinds toggle hyprland

# === Security ===
bind = SUPER ALT, L, exec, dms ipc call lock lock
bind = SUPER SHIFT, E, exit
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioPause, exec, dms ipc call mpris playPause
bindl = , XF86AudioPlay, exec, dms ipc call mpris playPause
bindl = , XF86AudioPrev, exec, dms ipc call mpris previous
bindl = , XF86AudioNext, exec, dms ipc call mpris next

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# === Window Management ===
bind = SUPER, W, killactive
# 1 maximize, 2 fullscreen
bind = SUPER SHIFT, T, fullscreen, 1
bind = SUPER, F, togglefloating
# bind = SUPER, Q, togglegroup

# === Focus Navigation ===
# bind = SUPER, SHIFT, L, togglelayout
bind = SUPER, left, movefocus, l
bind = SUPER, down, movefocus, d
bind = SUPER, up, movefocus, u
bind = SUPER, right, movefocus, r
bind = SUPER, Tab, layoutmsg, cyclenext
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# === Window Movement ===
bind = SUPER ALT, left, movewindoworgroup, l
bind = SUPER ALT, down, movewindoworgroup, d
bind = SUPER ALT, up, movewindoworgroup, u
bind = SUPER ALT, right, movewindoworgroup, r
bind = SUPER ALT, H, movewindoworgroup, l
bind = SUPER ALT, J, movewindoworgroup, d
bind = SUPER ALT, K, movewindoworgroup, u
bind = SUPER ALT, L, movewindoworgroup, r

# === Column Navigation ===
bind = SUPER, Home, focuswindow, first
bind = SUPER, End, focuswindow, last

# === Monitor Navigation ===
bind = SUPER CTRL, left, focusmonitor, l
bind = SUPER CTRL, right, focusmonitor, r
bind = SUPER CTRL, H, focusmonitor, l
bind = SUPER CTRL, J, focusmonitor, d
bind = SUPER CTRL, K, focusmonitor, u
bind = SUPER CTRL, L, focusmonitor, r

# === Move to Monitor ===
bind = SUPER SHIFT, left, movewindow, mon:l
bind = SUPER SHIFT, right, movewindow, mon:r
bind = SUPER SHIFT, H, movewindow, mon:l
bind = SUPER SHIFT, L, movewindow, mon:r

# === Move Workspaces ===
bind = SUPER SHIFT, Page_Down, movetoworkspace, e+1
bind = SUPER SHIFT, Page_Up, movetoworkspace, e-1
bind = SUPER SHIFT, down, movetoworkspace, e+1
bind = SUPER SHIFT, up, movetoworkspace, e-1
bind = SUPER SHIFT, U, movetoworkspace, e+1
bind = SUPER SHIFT, I, movetoworkspace, e-1

# === Workspace Navigation ===
bind = SUPER, Page_Down, workspace, m+1
bind = SUPER, Page_Up, workspace, m-1
bind = SUPER, mouse_down, workspace, m-1
bind = SUPER, mouse_up, workspace, m+1
bind = SUPER, U, workspace, m+1
bind = SUPER, I, workspace, m-1

# === Mouse Wheel Navigation ===
bind = SUPER CTRL, mouse_down, movetoworkspace, m+1
bind = SUPER CTRL, mouse_up, movetoworkspace, m-1

# === Numbered Workspaces ===
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, S, togglespecialworkspace
bind = SUPER SHIFT, S, movetoworkspace, special
bind = SUPER, Z, workspace, kitty
bind = SUPER, X, workspace, idea
bind = SUPER, C, workspace, code
bind = SUPER, V, workspace, browser
bind = SUPER, A, workspace, android
bind = SUPER, B, workspace, media
bind = SUPER, N, workspace, note

# === Move to Numbered Workspaces ===
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# === Column Management ===
bind = SUPER, bracketleft, layoutmsg, preselect l
bind = SUPER, bracketright, layoutmsg, preselect r

# === Sizing & Layout ===
bind = SUPER, R, layoutmsg, togglesplit
bind = SUPER CTRL, F, resizeactive, exact 100%

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = SUPER, mouse:272, Move window, movewindow
# bindmd = , mouse:274, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0

# === Manual Sizing ===
binde = SUPER, minus, resizeactive, -10% 0
binde = SUPER, equal, resizeactive, 10% 0
binde = SUPER SHIFT, minus, resizeactive, 0 -10%
binde = SUPER SHIFT, equal, resizeactive, 0 10%

# === Screenshots ===
bind = , F1, exec, /home/zonowry/.config/hypr/screenshot.sh

# === System Controls ===
bind = SUPER SHIFT, P, dpms, toggle
